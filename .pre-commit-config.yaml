repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        files: \.(yaml|yml)$
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff
        args: [--fix]
        files: \.py$
      - id: ruff-format
        files: \.py$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(ts|tsx|js|jsx|json|css|scss|md|yaml|yml)$
        exclude: ^(pnpm-lock\.yaml|package-lock\.json|LICENSE)$

  - repo: local
    hooks:
      - id: bicep-format
        name: bicep format
        entry: bash -c 'for f in "$@"; do az bicep format --indent-kind Space --indent-size 2 --insert-final-newline --file "$f"; done' --
        language: system
        types: [file]
        files: \.bicep$
