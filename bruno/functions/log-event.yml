info:
  name: Log Event (Event Grid)
  type: http
  seq: 1

http:
  method: POST
  url: "{{fns_url}}/api/log"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    content: |
      {
        "id": "event-123",
        "topic": "/subscriptions/xxx/resourceGroups/xxx/providers/Microsoft.EventGrid/topics/xxx",
        "subject": "memorywell/chronicles/abc123",
        "eventType": "ChronicleCreated",
        "eventTime": "2026-10-21T12:00:00Z",
        "data": {
          "chronicleId": "abc123",
          "name": "Grandma's Stories",
          "recipientId": "recipient-001"
        },
        "dataVersion": "1.0",
        "metadataVersion": "1"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
