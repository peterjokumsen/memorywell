info:
  name: Get chronicles
  type: http
  seq: 5

http:
  method: GET
  url: "{{fns_url}}/api/chronicles?householdId={{household_id}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: householdId
      value: "{{household_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
