info:
  name: Create household
  type: http
  seq: 1

http:
  method: POST
  url: "{{fns_url}}/api/households"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "My Household"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status == 201 && res.getBody().id) {
          bru.setVar('household_id', res.getBody().id);
          console.log('household_id set');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
