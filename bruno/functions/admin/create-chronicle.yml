info:
  name: Create chronicle
  type: http
  seq: 1

http:
  method: POST
  url: "{{fns_url}}/api/chronicles"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "householdId": "hh-dev",
        "name": "Leo's Chronicle"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
