info:
  name: Create chronicle
  type: http
  seq: 1

http:
  method: POST
  url: "{{fns_url}}/api/chronicles"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "householdId": "{{household_id}}",
        "name": "Leo's Chronicle"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status == 201 && res.getBody().id) {
          bru.setVar('chronicle_id', res.getBody().id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
