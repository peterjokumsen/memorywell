info:
  name: Claim invite
  type: http
  seq: 7

http:
  method: POST
  url: "{{bff_url}}/api/invites/claim"
  body:
    type: json
    data: |-
      {
        "token": "{{token}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
