name: scheduled-teardown

# Cost control: the dev environment (Cosmos, Postgres, Redis, Container Apps,
# Functions) costs money while it runs, so it is destroyed nightly and rebuilt
# on demand. Setup for the Azure app registration, RBAC and GitHub secrets is
# documented in docs/CI_TEARDOWN.md.
on:
  schedule:
    # Nightly at 02:00 UTC. GitHub disables scheduled workflows on repos with
    # no activity for 60 days, so check the Actions tab after long breaks.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment suffix to tear down (rg-<base>-<environment>)
        required: false
        default: dev
      delete_shared:
        description: Also delete the shared resource group (ACR)
        required: false
        default: false
        type: boolean
      dry_run:
        description: Show what would be deleted, change nothing in Azure
        required: false
        default: false
        type: boolean

permissions:
  id-token: write # OIDC token for azure/login (no stored client secret)
  contents: read

concurrency:
  # Never let two teardowns race: the second would see a "deleting" RG and
  # fail, and could purge a vault the first run already handled.
  group: teardown-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Teardown ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    # `environment` here is a GitHub Environment (protection rules + the OIDC
    # federated credential; see docs/CI_TEARDOWN.md) — not to be confused with
    # the `environment` workflow *input* below, which is the resource-group
    # name suffix in rg-<base>-<environment>.
    environment: azure # holds the OIDC federated credential; see docs/CI_TEARDOWN.md
    # Worst case: teardown.sh's 5 min vault wait + Verify's 30 min group wait +
    # 5 min vault wait, with headroom for Azure's own latency.
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Resolve config
        id: config
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_DELETE_SHARED: ${{ inputs.delete_shared }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          VAR_BASE_NAME: ${{ vars.BASE_NAME }}
          VAR_LOCATION: ${{ vars.LOCATION }}
          VAR_ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          VAR_SHARED_LOCK: ${{ vars.SHARED_LOCK }}
        run: |
          set -euo pipefail

          # scripts/common.sh derives rg-<base>-<env> and the vault name from
          # BASE_NAME / ENVIRONMENT and then runs `az account set --subscription
          # $SUBSCRIPTION_ID`; it reads .env, which is git-ignored, so the values
          # are injected into the environment instead.
          base_name="${VAR_BASE_NAME:-memwell}"
          location="${VAR_LOCATION:-westeurope}"
          environment="${INPUT_ENVIRONMENT:-${VAR_ENVIRONMENT:-dev}}"

          {
            echo "BASE_NAME=$base_name"
            echo "LOCATION=$location"
            echo "ENVIRONMENT=$environment"
            echo "SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          } >> "$GITHUB_ENV"

          echo "base_name=$base_name" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "vault_name=kv-$base_name-$environment" >> "$GITHUB_OUTPUT"

          # The shared RG (ACR) survives teardown by default: it is
          # subscription-scoped and expensive to recreate. Delete it only when a
          # manual run asks for it or SHARED_LOCK is not "true".
          # Inputs are empty strings on the schedule trigger, not "false".
          delete_shared_requested="${INPUT_DELETE_SHARED:-false}"
          dry_run_requested="${INPUT_DRY_RUN:-false}"

          shared_lock="${VAR_SHARED_LOCK:-true}"
          if [[ "$delete_shared_requested" == "true" ]]; then
            echo "delete_shared=1" >> "$GITHUB_OUTPUT"
            echo "SHARED_LOCK is '$shared_lock' but delete_shared was requested."
          elif [[ "$shared_lock" == "true" ]]; then
            echo "delete_shared=0" >> "$GITHUB_OUTPUT"
            echo "SHARED_LOCK=true; keeping the shared resource group."
          else
            echo "delete_shared=1" >> "$GITHUB_OUTPUT"
            echo "SHARED_LOCK=$shared_lock; shared resource group will be deleted too."
          fi

          if [[ "$dry_run_requested" == "true" ]]; then
            echo "dry_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Teardown
        if: steps.config.outputs.dry_run == '0'
        env:
          DELETE_SHARED: ${{ steps.config.outputs.delete_shared }}
          # teardown.sh waits this long for the vault to surface as
          # soft-deleted after `group delete --no-wait`. Short on purpose: the
          # Verify step owns the long wait (it is already polling the group),
          # and this must not eat into the job's timeout budget.
          VAULT_PURGE_WAIT_MINUTES: "5"
        run: |
          set -euo pipefail
          flags=(--purge-vault)
          if [[ "$DELETE_SHARED" == "1" ]]; then
            flags+=(--shared)
          fi
          ./scripts/teardown.sh "${flags[@]}"

      - name: Show what would be deleted (dry run)
        if: steps.config.outputs.dry_run == '1'
        env:
          DELETE_SHARED: ${{ steps.config.outputs.delete_shared }}
        run: |
          set -euo pipefail
          echo "DRY RUN — nothing below is executed."
          echo "Resource group:      rg-${{ steps.config.outputs.base_name }}-${{ steps.config.outputs.environment }}"
          echo "Key Vault purge:     ${{ steps.config.outputs.vault_name }}"
          echo "Shared RG deletion:  $([[ "$DELETE_SHARED" == "1" ]] && echo yes || echo no)"
          echo "Re-run without the dry_run input to apply."

      - name: Verify
        if: steps.config.outputs.dry_run == '0'
        env:
          BASE_NAME: ${{ steps.config.outputs.base_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          VAULT_NAME: ${{ steps.config.outputs.vault_name }}
          # The RG delete is async (teardown.sh uses --no-wait). Draining the
          # managed environment alone routinely takes >5 min, so allow 30,
          # checked every 10.
          RG_WAIT_TIMEOUT_MINUTES: "30"
          RG_CHECK_INTERVAL_MINUTES: "10"
          # After the group is gone the vault can take a further few minutes to
          # surface as soft-deleted; purge it rather than failing the run.
          VAULT_SOFT_DELETE_WAIT_MINUTES: "10"
        run: |
          set -euo pipefail
          rg_name="rg-$BASE_NAME-$ENVIRONMENT"
          status=0

          timeout_min="${RG_WAIT_TIMEOUT_MINUTES:-30}"
          interval_min="${RG_CHECK_INTERVAL_MINUTES:-10}"
          max_checks=$((timeout_min / interval_min))
          [[ "$max_checks" -ge 1 ]] || max_checks=1

          # Poll with check-state.sh --rg: it reports the group's provisioning
          # state and its resources' states (so the drain in progress is
          # visible), keeps the `+ az ...` traces off the console, and encodes
          # the verdict in its exit code — 0 gone, 1 not Succeeded, 2 all
          # Succeeded. Checked once up front, then every interval_min.
          gone=0
          for check in $(seq 0 "$max_checks"); do
            echo "== check $check/$max_checks for $rg_name"
            rc=0
            ./scripts/check-state.sh --rg "$rg_name" || rc=$?
            case "$rc" in
              0)
                gone=1
                echo "Resource group $rg_name is gone."
                break
                ;;
              1)
                echo "Resource group $rg_name still exists, with resources not Succeeded."
                ;;
              2)
                echo "Resource group $rg_name still exists and everything in it is Succeeded."
                ;;
              *)
                # Not a verdict: a usage error (64) or a crash. Do not keep
                # polling for 30 minutes on a broken script.
                echo "::error::check-state.sh --rg exited with $rc; cannot tell whether $rg_name is gone."
                status=1
                break
                ;;
            esac
            [[ "$check" -lt "$max_checks" ]] || break
            echo "Sleeping ${interval_min} min before the next check..."
            sleep $((interval_min * 60))
          done

          if [[ "$gone" -eq 0 ]]; then
            echo "::error::Resource group $rg_name still exists after ${timeout_min} min."
            status=1
          fi

          # A soft-deleted Key Vault blocks the next same-name deploy, but it
          # only shows up in list-deleted *after* the group is gone — so a run
          # that judged the vault too early used to fail here even though
          # teardown.sh had simply not seen it yet. Wait for it to surface,
          # then purge it: that is the state the next deploy needs. If it never
          # appears, the vault was already purged (or never existed).
          #
          # The list call must not be piped straight into grep: an `az` failure
          # would look like "no vault found" and pass silently.
          vault_wait_min="${VAULT_SOFT_DELETE_WAIT_MINUTES:-10}"
          vault_attempts=$((vault_wait_min * 60 / 30))
          [[ "$vault_attempts" -ge 1 ]] || vault_attempts=1
          purged=0
          vault_checked=0
          for attempt in $(seq 1 "$vault_attempts"); do
            vault_checked=1
            if ! deleted_vaults=$(az keyvault list-deleted --query "[?name=='$VAULT_NAME'].name" -o tsv); then
              echo "::error::Failed to list soft-deleted Key Vaults; cannot settle the state of $VAULT_NAME."
              status=1
              break
            fi
            if printf '%s\n' "$deleted_vaults" | grep -q "$VAULT_NAME"; then
              echo "Key Vault $VAULT_NAME is soft-deleted; purging it."
              if az keyvault purge --name "$VAULT_NAME"; then
                purged=1
                echo "Key Vault $VAULT_NAME purged."
              else
                echo "::error::Failed to purge $VAULT_NAME; the next same-name deploy will be blocked."
                status=1
              fi
              break
            fi
            if [[ "$attempt" -lt "$vault_attempts" ]]; then
              echo "Vault check $attempt/$vault_attempts: $VAULT_NAME is not soft-deleted yet, retrying in 30s..."
              sleep 30
            fi
          done
          if [[ "$purged" -eq 0 && "$vault_checked" -eq 1 && "$status" -eq 0 ]]; then
            echo "Key Vault $VAULT_NAME is not soft-deleted; nothing to purge."
          fi

          exit "$status"

      # The three log files written by init_command_log (command traces, stdout,
      # stderr) hold what the console deliberately hides: stderr from the
      # existence probes, and command output consumed by a $(...) capture.
      # `if: always()` so a red run is still diagnosable after the runner is
      # discarded; ignored on a dry run, which runs no scripts and so writes
      # none. Short retention: these are per-nightly debug artifacts, not
      # something to keep.
      - name: Upload script logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-logs-${{ inputs.environment || 'dev' }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
